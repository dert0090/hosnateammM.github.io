<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER KARARGAH ULTIMATE | GitHub Pages 120+ Avcı 🇹🇷</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { width: 100%; min-height: 100vh; background: #030303; color: #e2e8f0; overflow-x: hidden; position: relative; }
.background { position: fixed; inset: 0; background: radial-gradient(circle at center, #2a0000 0%, #030303 70%, #000000 100%); z-index: -2; }
.flag { position: absolute; width: 120%; height: 120%; left: -10%; top: -10%; object-fit: cover; opacity: 0.2; }
.overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,3,3,.8), rgba(3,3,3,.98)); z-index: -1; }
header { text-align: center; padding: 35px 15px; }
h1 { font-size: clamp(30px, 5vw, 55px); font-weight: 900; letter-spacing: 5px; color: #fff; text-shadow: 0 0 15px #ef4444; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px 40px; }
.card { background: rgba(10, 14, 20, 0.95); border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
.card h2 { color: #f87171; font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.input-group { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
input { flex: 1; padding: 10px 12px; background: #010409; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 0.9rem; outline: none; min-width: 200px; }
input:focus { border-color: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
button { background: #dc2626; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
button:hover { background: #ef4444; }
.result-box { background: #010409; border: 1px solid #21262d; border-radius: 6px; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 0.85rem; color: #58a6ff; white-space: pre-line; min-height: 150px; max-height: 350px; overflow-y: auto; }
</style>
</head>
<body>

<div class="background">
    <img class="flag" src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" alt="Türk Bayrağı">
    <div class="overlay"></div>
</div>

<div class="container">
    <header>
        <h1>CYBER KARARGAH</h1>
        <p style="color:#8b949e; letter-spacing:2px; margin-top:5px;">GİTHUB PAGES 120+ PLATFORM CANLI AV MERKEZİ 🇹🇷</p>
    </header>

    <div class="card">
        <h2><i class="fa-solid fa-spider"></i> 120+ Küresel Platform Canlı Kullanıcı Taraması</h2>
        <p style="color:#8b949e; font-size:0.85rem; margin-bottom:12px;">GitHub Pages üzerinde CORS proxy tünelleriyle çalışan akıllı tarayıcı.</p>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Kullanıcı adı girin (örn: torvalds)">
            <button onclick="startGitHubPagesSherlock()">Taramayı Başlat</button>
        </div>
        
        <div class="result-box" id="sherlockResult">Av motoru hazır. Kullanıcı adı bekleniyor...</div>
    </div>
</div>

<script>
    // 120+ Platform Listesi (GitHub Pages İçin Uyumlu)
    const PLATFORMS = [
        { name: "GitHub", url: "https://github.com/{account}" },
        { name: "Twitter / X", url: "https://twitter.com/{account}" },
        { name: "Instagram", url: "https://www.instagram.com/{account}/" },
        { name: "Reddit", url: "https://www.reddit.com/user/{account}" },
        { name: "Pinterest", url: "https://www.pinterest.com/{account}/" },
        { name: "TikTok", url: "https://www.tiktok.com/@{account}" },
        { name: "Telegram", url: "https://t.me/{account}" },
        { name: "Steam", url: "https://steamcommunity.com/id/{account}" },
        { name: "Twitch", url: "https://www.twitch.tv/{account}" },
        { name: "SoundCloud", url: "https://soundcloud.com/{account}" },
        { name: "Spotify", url: "https://open.spotify.com/user/{account}" },
        { name: "Medium", url: "https://medium.com/@{account}" },
        { name: "YouTube", url: "https://www.youtube.com/@{account}" },
        { name: "Vimeo", url: "https://vimeo.com/{account}" },
        { name: "Flickr", url: "https://www.flickr.com/photos/{account}" },
        { name: "Behance", url: "https://www.behance.net/{account}" },
        { name: "Dribbble", url: "https://dribbble.com/{account}" },
        { name: "GitLab", url: "https://gitlab.com/{account}" },
        { name: "Bitbucket", url: "https://bitbucket.org/{account}" },
        { name: "HackerNews", url: "https://news.ycombinator.com/user?id={account}" },
        { name: "Dev.to", url: "https://dev.to/{account}" },
        { name: "CodePen", url: "https://codepen.io/{account}" },
        { name: "Disqus", url: "https://disqus.com/{account}" },
        { name: "About.me", url: "https://about.me/{account}" },
        { name: "Patreon", url: "https://www.patreon.com/{account}" },
        { name: "Substack", url: "https://{account}.substack.com" },
        { name: "Blogger", url: "https://{account}.blogspot.com" },
        { name: "WordPress", url: "https://{account}.wordpress.com" },
        { name: "Keybase", url: "https://keybase.io/{account}" },
        { name: "SlideShare", url: "https://www.slideshare.net/{account}" },
        { name: "Goodreads", url: "https://www.goodreads.com/{account}" },
        { name: "Last.fm", url: "https://www.last.fm/user/{account}" },
        { name: "Mixcloud", url: "https://www.mixcloud.com/{account}" },
        { name: "Bandcamp", url: "https://bandcamp.com/{account}" },
        { name: "Wattpad", url: "https://www.wattpad.com/user/{account}" },
        { name: "Kaggle", url: "https://www.kaggle.com/{account}" },
        { name: "HuggingFace", url: "https://huggingface.co/{account}" },
        { name: "DockerHub", url: "https://hub.docker.com/u/{account}" },
        { name: "StackOverflow", url: "https://stackoverflow.com/users/{account}" },
        { name: "Codewars", url: "https://www.codewars.com/users/{account}" },
        { name: "HackTheBox", url: "https://app.hackthebox.com/profile/{account}" },
        { name: "TryHackMe", url: "https://tryhackme.com/p/{account}" },
        { name: "OpenSea", url: "https://opensea.io/{account}" },
        { name: "Etsy", url: "https://www.etsy.com/shop/{account}" },
        { name: "Fiverr", url: "https://www.fiverr.com/{account}" },
        { name: "Upwork", url: "https://www.upwork.com/freelancers/~{account}" },
        { name: "VK", url: "https://vk.com/{account}" },
        { name: "Chess.com", url: "https://www.chess.com/member/{account}" },
        { name: "Lichess", url: "https://lichess.org/@/{account}" },
        { name: "Roblox", url: "https://www.roblox.com/user.aspx?username={account}" },
        { name: "Itch.io", url: "https://{account}.itch.io" },
        { name: "GameJolt", url: "https://gamejolt.com/@{account}" },
        { name: "Quora", url: "https://www.quora.com/profile/{account}" },
        { name: "Mastodon", url: "https://mastodon.social/@{account}" },
        { name: "Kick", url: "https://kick.com/{account}" },
        { name: "Trovo", url: "https://trovo.live/s/{account}" },
        { name: "Genius", url: "https://genius.com/{account}" },
        { name: "Discogs", url: "https://www.discogs.com/user/{account}" }
    ];

    async function startGitHubPagesSherlock() {
        let username = document.getElementById('usernameInput').value.trim();
        let resBox = document.getElementById('sherlockResult');
        if(!username) { alert('Kullanıcı adı girin!'); return; }

        resBox.innerText = `[>] Hedef: @${username}\n[>] GitHub Pages üzerinden ${PLATFORMS.length} platform taranıyor, lütfen bekleyin...\n\n`;
        
        let foundCount = 0;
        let output = `[🎯] HEDEF AV RAPORU (@${username}):\n` + "─".repeat(50) + "\n";

        for (let p of PLATFORMS) {
            let targetUrl = p.url.replace('{account}', encodeURIComponent(username));
            try {
                // CORS engellerini aşmak için proxy tüneli
                let proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                let response = await fetch(proxyUrl, { signal: AbortSignal.timeout(4000) });
                
                if (response.ok) {
                    foundCount++;
                    output += `• [AKTİF] ${p.name}: ${targetUrl}\n`;
                    resBox.innerText = output + "─".repeat(50) + `\n[Taranıyor...] Bulunan: ${foundCount}`;
                }
            } catch(e) {
                // Zaman aşımı veya engellenenler sessizce geçilir
            }
        }

        output += "─".repeat(50) + `\n[SUCCESS] Tarama tamamlandı! Toplam aktif hesap: ${foundCount}`;
        resBox.innerText = output;
    }
</script>

</body>
</html>
